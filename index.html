
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barangay Lumangbayan Online Service Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section id="welcomePage" class="page">
    <div class="container">
        <img src="logo.png" class="logo" alt="Barangay Logo">
        <h1>Barangay Lumangbayan</h1>
        <h2>Online Service Portal</h2>
        <p>Access barangay services and submit document requests online.</p>
        <div class="live-status" role="status">
            <span class="live-dot" aria-hidden="true"></span>
            <span>Portal online</span>
+        </div>
        <time id="liveClock" class="live-clock" aria-live="off">Loading local time</time>
        <button onclick="showLogin()">Sign In</button>
    </div>
</section>

<section id="loginPage" class="page" style="display:none">
    <div class="container">
        <img src="logo.png" class="logo" alt="Barangay Logo">
        <h1>Sign in to your account</h1>

        <form onsubmit="login(event)">
            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label>Password</label>
            <div class="password-box">
                <input type="password" id="password" placeholder="Password" required>
                <button type="button" class="eye" onclick="togglePassword('password',this)">👁</button>
            </div>

            <div class="options">
                <label><input type="checkbox" id="rememberMe"> Remember me</label>
                <a href="#" onclick="forgotPassword(event)">Forgot password?</a>
            </div>

            <button type="submit">Sign In</button>
            <p id="loginMessage"></p>
        </form>

        <p>Don't have an account? <a href="#" onclick="showRegister(event)">Sign Up</a></p>
    </div>
</section>

<section id="registerPage" class="page" style="display:none">
    <div class="container">
        <img src="logo.png" class="logo" alt="Barangay Logo">
        <h1>Create an account</h1>

        <form onsubmit="registerAccount(event)">
            <label>Username</label>
            <input type="text" id="registerUsername" placeholder="Username" required>

            <label>Email</label>
            <input type="email" id="registerEmail" placeholder="Enter your email" required>

            <label>Password</label>
            <div class="password-box">
                <input type="password" id="registerPassword" placeholder="Create a password" required>
                <button type="button" class="eye" onclick="togglePassword('registerPassword',this)">👁</button>
            </div>

            <label class="terms">
                <input type="checkbox" id="terms" required>
                I agree to the terms and conditions
            </label>

            <button type="submit">Register</button>
            <p id="registerMessage"></p>
        </form>

        <p>Already have an account? <a href="#" onclick="backToLogin(event)">Login</a></p>
    </div>
</section>

<script src="scrip.js"></script>
</body>
</html>
