
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | School Announcement Hub</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="logo">📢</div>
        <h1>Create Account</h1>
        <p class="subtitle">Join the School Announcement Hub</p>

        <form id="signupForm">
            <label for="signupName">Full Name</label>
            <input type="text" id="signupName" placeholder="Enter your full name" required>

            <label for="signupEmail">Email</label>
            <input type="email" id="signupEmail" placeholder="Enter your email" required>

            <label for="signupPassword">Password</label>
            <div class="password-wrapper">
                <input type="password" id="signupPassword" placeholder="Create a password" minlength="6" required>
                <button type="button" class="toggle-password" data-target="signupPassword">👁</button>
            </div>

            <label for="confirmPassword">Confirm Password</label>
            <div class="password-wrapper">
                <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                <button type="button" class="toggle-password" data-target="confirmPassword">👁</button>
            </div>

            <button type="submit" class="main-button">Create Account</button>
            <p id="signupMessage" class="message"></p>
        </form>

        <p class="switch-page">Already have an account?
            <a href="login.html">Login</a>
        </p>
    </div>
</body>
</html>
